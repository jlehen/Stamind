# Publishes the gym logger page at https://jlehen.github.io/Stamind/ (DESIGN_gym_logger.md §2).
name: Deploy the gym logger to GitHub Pages

on:
  push:
    branches:
      - main
      - worktree-worktree-gym-logger
    paths:
      - 'miniapp/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued push waits rather than cancelling the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: miniapp
      - id: deployment
        uses: actions/deploy-pages@v4
