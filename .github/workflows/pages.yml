# Publishes the gym logger page at https://jlehen.github.io/Stamind/miniapp/
# (DESIGN_gym_logger.md §2).
name: Deploy the gym logger to GitHub Pages

on:
  push:
    branches:
      - main
      - worktree-worktree-gym-logger
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued push waits rather than cancelling the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The page lives under /miniapp/ on the site, so the site root stays free (§2).
      - run: mkdir -p _site && cp -r miniapp _site/miniapp
      # Every deploy gets new file addresses, so a cached old app.js never runs under a new
      # index.html (§2).
      - run: sed -i "s/?v=dev/?v=${GITHUB_SHA::12}/g" _site/miniapp/index.html _site/miniapp/app.js \
          _site/miniapp/markdown.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
